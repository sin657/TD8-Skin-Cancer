{% extends "base.html" %}
{% block title %}Nouvelle analyse – SkinAI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow border-0">
      <div class="card-body p-5">
        <h2 class="fw-bold mb-1"><i class="bi bi-search-heart text-primary me-2"></i>Analyse patient</h2>
        <p class="text-muted mb-4">Renseignez les informations et uploadez l'image de la lésion.</p>
        <form method="POST" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nom du patient</label>
            <input type="text" name="name" class="form-control" placeholder="Ex : Ahmed Ben Ali" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Âge</label>
            <input type="number" name="age" class="form-control" placeholder="Ex : 45" min="1" max="120" required />
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Image de la lésion</label>
            <input type="file" name="image" class="form-control" accept="image/*" required
                   onchange="previewImage(this)" />
            <div class="mt-3 text-center" id="preview-box" style="display:none">
              <img id="preview" src="" alt="Aperçu" class="img-thumbnail" style="max-height:200px" />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
            <i class="bi bi-cpu me-2"></i>Analyser avec l'IA
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
function previewImage(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('preview').src = e.target.result;
      document.getElementById('preview-box').style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
