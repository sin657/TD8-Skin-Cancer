{% extends "base.html" %}
{% block title %}Connexion – SkinAI{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-lg border-0">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="bi bi-activity text-primary" style="font-size:3rem"></i>
          <h2 class="mt-2 fw-bold">SkinAI</h2>
          <p class="text-muted">Diagnostic de lésions cutanées</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control" placeholder="admin" required />
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Mot de passe</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" placeholder="••••" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
          </button>
        </form>
        <p class="text-center text-muted mt-3" style="font-size:.85rem">
          Compte par défaut : <strong>admin / 1234</strong>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
